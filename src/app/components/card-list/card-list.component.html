<div class="flex flex-col h-full" >
    <div class="flex justify-center mb-2">
        <button class="hidden" onclick="searchModal.showModal()" id="toggleModal">hidden</button>
        <div class="join flex w-full">
            <app-speech-to-text *ngIf="gameService.room.game?.transcribeActive"></app-speech-to-text>
            <button class="btn btn-sm btn-outline text-white join-item rounded-none flex-1 btn-action" (click)="openSearchModal()" appTooltip="Search cards (ctrl+q) or just start typing" [tooltipDirection]="'left'">Search Cards</button>
            <button class="btn btn-sm btn-outline text-white join-item rounded-none btn-action" (click)="clearSearchHistory()"><ng-icon name="bootstrapTrash3"></ng-icon></button>
        </div>
    </div>

    <dialog id="searchModal" class="modal ">
        <div class="modal-box bg-slate-800 text-white absolute top-2">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-action btn-ghost absolute right-2 top-2" id="closeModal" >✕</button>
            </form>

            <h3 class="text-lg font-bold">Card Search <span class="text-sm">({{this.gameService.room.game?.searchTag}})</span></h3>
            <p class="text-sm">Select to share</p>

            <form #searchForm="ngForm" (ngSubmit)="sendSearch()" class="mb-2">
                <input (ngModelChange)="searchStringChanged($event)" type="text" #cardInput id="cardInput" name="cardInput" [(ngModel)]="searchString" required class="popupColors mt-1 p-2 w-full border rounded-md shadow-sm">
                <div class="flex flex-row">
                    <label *ngIf="gameService.isMagicGame()" class="mr-4 flex flex-row items-center cursor-pointer">
                        <span class="mr-1">Tokens only</span>
                        <input 
                            type="radio" 
                            [(ngModel)]="includeOption" 
                            [value]="'tokens'" 
                            name="searchOption"
                        >
                    </label>
                      
                    <label *ngIf="gameService.isMagicGame()" class="flex flex-row items-center cursor-pointer">
                        <span class="mr-1">Emblems only</span>
                        <input 
                            type="radio" 
                            [(ngModel)]="includeOption" 
                            [value]="'emblems'" 
                            name="searchOption"
                        >
                    </label>

                    <label *ngIf="gameService.isOnePieceGame()" class="flex flex-row items-center cursor-pointer">
                        <span class="mr-1">Leaders only</span>
                        <input 
                            type="radio" 
                            [(ngModel)]="includeOption" 
                            [value]="'Leader'" 
                            name="searchOption"
                        >
                    </label>
                </div>
                
            </form>

            <p class="text-xs text-pop">Tip: Typing while in game will auto open the search window</p>

            <div *ngIf="!searching && searchResults && searchResults.length > 0">
                <div class="flex flex-row">
                    <div class="grow" [ngClass]="{'overflow-hidden': !searchResults || searchResults.length <= 8, 'overflow-y-scroll': searchResults && searchResults.length > 8}" id="cardResults">
                        <div *ngFor="let card of searchResults"
                            tabindex="0"
                            (mouseenter)="onCardHover(card)"
                            (mouseleave)="onCardHover(null)"
                            (focus)="onCardHover(card)"
                            (blur)="onCardHover(null)"
                            (keydown.enter)="$event.preventDefault();selectCard(card)"
                            (click)="selectCard(card)"
                            class="">

                            <app-card-list-item [card]="card"></app-card-list-item>

                            <!-- Action buttons when this card is selected -->
                            <div *ngIf="card.selected" class="flex ml-2.5 mr-2.5 mb-2">
                                <button class="btn btn-xs btn-outline btn-action grow text-pop"
                                        (click)="shareCard(false, true)">Share</button>
                                <button class="btn btn-xs btn-outline btn-action grow text-white"
                                        (click)="shareCard(false, false)">Save</button>
                            </div>
                        </div>
                    </div>
                    <div class="max-w-64 min-w-64 ml-3">
                        <app-card [card]="cardBeingHovered" [showPopup]="false" (click)="shareCard(true)"></app-card>
                    </div>
                </div>
            </div>

            <p *ngIf="searchResults.length < 1 && hasSearched && !searching" class="text-white">No cards found</p>

            <div class="flex justify-center pt-3" *ngIf="searching">
                <app-loading-spinner></app-loading-spinner>
            </div>

        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <div class="flex-1 min-h-0 overflow-y-auto">
        <!-- <div class="flex-1 min-h-0 overflow-y-auto" id="scrollableDiv"> -->

            @if(sharedCards && sharedCards.length > 0){
                <app-card [card]="sharedCards[0]" (deleteClicked)="deleteCardFromSearchHistory(sharedCards[0])" [maximumRightMargin]="260" ></app-card>
            }

            <div class="flex justify-center" *ngIf="sharedCards != null && sharedCards.length > 1">
                <hr class="mt-2 mb-3 w-1/2" id="cardSeperator">
            </div>
            

            <div class="relative">
                @for (card of sharedCards | slice:1; track card; let  i = $index) {    
                    <app-card [card]="card" (deleteClicked)="deleteCardFromSearchHistory(card)" [maximumRightMargin]="260" [ngClass]="{'cascadingCard': i > 0 }" [ngStyle]="{'top.px': (i * 50)}"></app-card>
                }
            </div>
            
            
        <!-- </div> -->
    </div>

</div>
