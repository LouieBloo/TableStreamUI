<div class="drawer drawer-end">
    <input id="my-drawer" type="checkbox" class="drawer-toggle" />

    <div class="w-screen h-screen flex flex-col drawer-content ">

        <div class="flex flex-row flex-grow">
           
            <div class="flex-grow" id="userStreams">
                <!-- Top row -->
                <div class="grid" [ngClass]="{'grid-cols-2': topRowPlayers.length === 2, 'grid-cols-3': topRowPlayers.length > 2}">
                    <div *ngFor="let player of topRowPlayers" class="bg-slate-800" [ngClass]="bottomRowPlayers.length < 1 ? 'full-height' : 'half-height'">
                        <app-user-stream [player]="player" [localStream]="player.id == localPlayerId"></app-user-stream>
                    </div>
                </div>
            
                <!-- Bottom row -->
                <div class="grid" [ngClass]="{'grid-cols-1': bottomRowPlayers.length === 1,'grid-cols-2': bottomRowPlayers.length === 2, 'grid-cols-3': bottomRowPlayers.length > 2}">
                    <div *ngFor="let player of bottomRowPlayers" class="bg-slate-800 half-height">
                        <app-user-stream [player]="player" [localStream]="player.id == localPlayerId"></app-user-stream>
                    </div>
                </div>
            </div>

            <div>
                <div *ngFor="let token of gameService.room?.game?.tokens">
                    <app-card-token [token]="token" [editable]="token.ownerId == localPlayer.id"></app-card-token>
                </div>
            </div>

            <div class="flex flex-col p-1 bg-slate-900 min-w-64 max-w-64 pl-2 pr-2">

                <div class="">
                    <h3 class="text-white">Room Name: <span class="text-pop">{{gameService.room.name}}</span></h3>
                    <h3 class="text-white">Game Type: <span class="text-pop capitalize">{{gameService.room.game?.name}}</span></h3>
                    <h3 class="text-white mb-2 ">Game Time: <app-timer [date]="gameService.room.game?.startedAt"></app-timer></h3>

                    <div class="justify-center mb-2 grid grid-cols-2">
                        <div *ngIf="localPlayer?.admin" appTooltip="Start game when ready" [tooltipDirection]="'left'" [tooltipStartOpen]="true"><label for="my-drawer" class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none" >Game</label></div>
                        <button (click)="copyUrl()" class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none">Share Link</button>
                        <button (click)="reportComponent.open()" class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none">Report Issue</button>
                        <button (click)="showingHotkeys = !showingHotkeys" class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none">{{showingHotkeys ? 'Hide Hotkeys' : 'Show Hotkeys'}}</button>
                    </div>
                    
                    <div *ngIf="showingHotkeys" class="mb-4">
                        <ul class="text-white ">
                            <li>(Space Bar) - pass turn</li>
                            <li>(Up Arrow) - add health</li>
                            <li>(Down Arrow) - remove health</li>
                            <li>(Ctrl + q) - search cards</li>
                            <li>(alt + q)  - search cards</li>
                        </ul>
                    </div>
                </div>

                <app-messenger></app-messenger>

                <div class="justify-center mt-2 grid grid-cols-2">
                    <div class="flex flex-row">
                        <button (click)="flipCoins(1)" class="btn btn-sm btn-outline text-white drawer-button rounded-none grow" style="border-right: none;">Flip Coin</button>
                        <div class="dropdown dropdown-left text-white rounded-none " >
                            <div tabindex="0" role="button" class="flex flex-col h-full justify-center">
                                <button class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none ">+</button>
                            </div>
                            <ul  tabindex="0" class="dropdown-content menu popupColors rounded-box z-[1] w-52 p-2 shadow text-slate-800">
                                <li (click)="flipCoins(2)"><a>2</a></li>
                                <li (click)="flipCoins(3)"><a>3</a></li>
                                <li (click)="flipCoins(4)"><a>4</a></li>
                                <li (click)="flipCoins(5)"><a>5</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="flex flex-row">
                        <button (click)="rollDice(1,6)" class="btn btn-sm btn-outline text-white drawer-button rounded-none grow" style="border-right: none;">Roll Dice</button>
                        <div class="dropdown dropdown-left text-white rounded-none " >
                            <div tabindex="0" role="button" class="flex flex-col h-full justify-center">
                                <button class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none ">+</button>
                            </div>
                            <ul  tabindex="0" class="dropdown-content menu popupColors rounded-box z-[1] w-52 p-2 shadow text-slate-800">
                                <li (click)="rollDice(1,4)"><a>D4</a></li>
                                <li (click)="rollDice(1,8)"><a>D8</a></li>
                                <li (click)="rollDice(1,12)"><a>D12</a></li>
                                <li (click)="rollDice(1,20)"><a>D20</a></li>
                            </ul>
                        </div>
                    </div>
                    <button *ngIf="gameService.room.reactionsEnabled" (click)="soundEffectModal.open()" class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none">Reactions</button>
                    <button (click)="tokenModal.open()" class="btn btn-sm btn-outline text-white drawer-button w-full rounded-none">Tokens</button>
                </div>

                <div class="mt-2">
                    <app-card-list></app-card-list>
                </div>
                
            </div>
            
        </div>
        
    </div>

    <div class="drawer-side ">
        <label for="my-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
        <ul class="menu popupColors min-h-full w-80 p-4">
            <li><button type="button" (click)="startGame()">Start Game</button></li>
            <li><button type="button" (click)="resetGame()">Reset Game</button></li>
            <li><button type="button" (click)="playerTurnOrderModal.open()">Modify Turn Order</button></li>
        </ul>
    </div>

    <app-report-modal></app-report-modal>
    <app-sound-effect-modal [localPlayer]="localPlayer"></app-sound-effect-modal>
    <app-password-modal (joinGame)="loadIntoGame($event)" (goBackEvent)="goBack()"></app-password-modal>
    <app-player-turn-order-modal></app-player-turn-order-modal>
    <app-token-modal></app-token-modal>
</div>
