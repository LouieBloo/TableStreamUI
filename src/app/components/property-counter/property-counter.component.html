<div class="bg-black bg-opacity-50 text-sm rounded-md w-full" [ngClass]="{'w-full': fullWidth, 'join': joined}">
    <button *ngIf="editable" type="button" class=" button text-white p-1 join-item " (click)="modifyCallback(-1)" [ngClass]="buttonClass">-1</button>
    <div class="dropdown join-item button text-white pl-4 pr-4" [ngClass]="{'w-full': fullWidth}" appTooltip="{{tooltip}}" [tooltipDirection]="'right'" >
        <div tabindex="0" role="button" class="flex flex-col h-full justify-center">
            <p class="text-center">{{title | titlecase}}</p>
            <p class="flex items-center justify-center">{{totalString}}<ng-icon *ngIf="iconClass" [ngClass]="iconColor" class="mr-1 text-md" name="{{iconClass}}"></ng-icon>{{total}}</p>
        </div>
        <ul *ngIf="editable" tabindex="0" class="dropdown-content menu popupColors rounded-box z-[1] w-52 p-2 shadow ">
            <li (click)="modifyCallback(-total)"><a>Set to 0</a></li>
        </ul>
    </div>
    <button *ngIf="editable" type="button" class=" button text-white p-1 join-item" (click)="modifyCallback(1)" [ngClass]="buttonClass">+1</button>
</div>
