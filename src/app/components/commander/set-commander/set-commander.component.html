<div *ngIf="editable && commanders.length < 2">
    <button type="button" class="text-sm flex items-center text-pop" (click)="openSearch()">Commander
        <ng-icon class="ml-1" name="bootstrapPencilSquare"></ng-icon>
    </button>
</div>
<div *ngFor="let commander of commanders" class="relative group " (mouseover)="onMouseOver($event)">
    <p class="text-sm flex items-center cursor-pointer text-pop" (click)="openSearch()">{{commander?.name}}
        <ng-icon *ngIf="editable" class="ml-1" name="bootstrapPencilSquare"></ng-icon>
    </p>
    <div class="fixed hidden group-hover:block z-10">
        <div class="">
            <img [src]="imageSrc(commander)" alt="Card Image" class="cardHoverImg w-full rounded-xl" [style.top.px]="popoverPosition.top" [style.left.px]="popoverPosition.left">
        </div>
    </div>
</div>
