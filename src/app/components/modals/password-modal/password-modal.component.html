<button class="hidden" onclick="passwordModal.showModal()" id="togglePasswordModal">toggle</button>
<button class="hidden" onclick="passwordModal.close()" id="closePasswordModal">toggle</button>

<dialog id="passwordModal" class="modal">
    <div class="modal-box bg-slate-800 text-white absolute top-2">
        <h3 class="text-lg font-bold">Enter Password</h3>
        <p *ngIf="(roomPasswordValid | async) == false" class="text-red-500 text-xs italic">Invalid password!</p>
        <form #passwordForm="ngForm" (ngSubmit)="savePassword()" class="mt-4">
            <div class="mb-4">
              <label for="password" class="block text-sm font-medium text-white">Password:</label>
              <input
                type="text"
                id="password"
                name="password"
                [(ngModel)]="password"
                required
                autocomplete="off"
                class="mt-1 p-2 w-full border rounded-md shadow-sm bg-gray-200 text-black"
              />
            </div>
            <button
              type="submit"
              class="w-full btn btn-outline text-white py-2 px-4 rounded disabled:text-gray-500 disabled:border-slate-600 disabled:cursor-not-allowed btn-action"
              [disabled]="!passwordForm.valid">
              Join Game
            </button>
            <button
              (click)="goBack()"
              class="w-full btn btn-ghost bg-white text-black mt-3  py-2 px-4 rounded btn-action">
              Go back
            </button>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
