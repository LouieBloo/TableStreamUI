<div *ngIf="card" 
     class="w-64 bg-slate-800 rounded-xl shadow-2xl p-2 flex flex-col gap-2 border border-white/10">

  <!-- Renders your existing card component -->
  <app-card [card]="card" [showPopup]="false" [hoverMinDistance]="130"></app-card>

  <!-- Container for the action buttons -->
  <div class="flex justify-between">
    <!-- Share Button -->
    <button 
      (click)="onShare()"
      class="flex-grow rounded-none cursor-pointer 
             transition-all duration-200 ease-in-out
             btn btn-sm btn-outline text-pop
             hover:-translate-y-0.5 hover:shadow-lg hover:bg-slate-600
             active:translate-y-0 active:shadow-none ">
      Share
    </button>
    
    <!-- Dismiss Button -->
    <button 
      (click)="onDismiss()"
      class="flex-grow rounded-none cursor-pointer 
             transition-all duration-200 ease-in-out
             btn btn-sm btn-outline text-white
             hover:-translate-y-0.5 hover:shadow-lg hover:bg-slate-600
             active:translate-y-0 active:shadow-none">
      Dismiss
    </button>
  </div>
</div>
