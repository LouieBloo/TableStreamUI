<div class="flex justify-center " *ngIf="player.prizeCards == 0">
    <img src="crown.png" class="w-16 animate__animated animate__bounceInDown cursor-pointer">
</div>
<div *ngIf="player" class="flex flex-row ">
    
    <div class="relative">

        <div class="join bg-black bg-opacity-50 text-sm">
            <button *ngIf="editable" type="button" class=" button text-white p-1 join-item" (click)="modifyPrizeCardsCallback(-1)">-1</button>
    
            <div class="dropdown join-item button text-white pl-4 pr-4" >
                <div tabindex="0" role="button" class="flex flex-col h-full justify-center">
                    <p class="text-center">{{player.name | titlecase}}</p>
                    <p class="text-center">Prize Cards: 🏆{{player.prizeCards}}</p>
                </div>
            </div>
    
            <button *ngIf="editable" type="button" class=" button text-white p-1 join-item" (click)="modifyPrizeCardsCallback(1)">+1</button>
        </div>
    </div>
</div>
